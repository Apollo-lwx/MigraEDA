[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "migraeda"
version = "0.1.0"
description = "Pin-level verified conversion between JLCEDA (.eprj) and Altium Designer (.SchDoc, .PcbDoc), plus EasyEDA Pro (.epro) migration checks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "dan luo" }]
keywords = [
  "jlc",
  "jlceda",
  "easyeda",
  "eprj",
  "altium",
  "schdoc",
  "pcbdoc",
  "kicad",
  "eda",
  "lvs",
  "pcb",
  "schematic",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
mcp = ["mcp>=1.8"]

[project.scripts]
migraeda = "migraeda.cli:main"
migraeda-mcp = "migraeda.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
